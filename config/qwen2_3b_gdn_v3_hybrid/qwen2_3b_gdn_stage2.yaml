data:
  # name: "robbiegwaldd/dclm-10B"
  # path: "robbiegwaldd/dclm-10B"
  cache_dir: '/proj/checkpoints/songlin/data_cache/chunked_context4096'

teacher_model:
  name: 'fla-hub/Qwen2.5-3B-Instruct'

student_model:
  name: 'gdn_v3'
  keep_full_attention_layers: [0, 1, 18, 19, 26]

train:
  target_tokens: 400_000_000
  batch_size: 32
  micro_batch_size: 2
  train_seq_len: 4096
  lr_scheduler_type: constant
  lr: 0.000007 # all but attention layers
  lr_attn: 0.0001 # attention layers

  max_grad_norm: 1.0
  output_dir: '/proj/checkpoints/songlin/outputs/qwen_3b_instruct_gdn3_hybrid_0_125/stage2'
  student_init_ckpt: '/proj/checkpoints/songlin/outputs/qwen_3b_instruct_gdn3_hybrid_0_125/stage1/converted-hf'
  max_length: 4096
  # tokenizer
  add_eos_token: False
  resume_from_checkpoint: None

stage: 2
